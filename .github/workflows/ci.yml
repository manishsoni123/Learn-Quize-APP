name: CI

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:

jobs:
  mobile:
    name: Mobile (typecheck · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  database:
    name: Database (migrations + smoke suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Applies every migration to a throwaway Postgres 17 and runs ~90
      # assertions over the game loop and security boundary.
      - run: bash supabase/tests/run.sh
